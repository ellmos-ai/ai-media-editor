[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-media-editor"
version = "0.2.0"
description = "Local-first AI media editor for video, audio, and podcast workflows driven by AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "ai",
    "video-editor",
    "podcast-editor",
    "local-stt",
    "faster-whisper",
    "whisperx",
    "hyperframes",
    "video-use",
    "agent-workflow",
    "llm-ready"
]
authors = [
    { name = "ellmos-ai" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/ai-media-editor"
Repository = "https://github.com/ellmos-ai/ai-media-editor.git"
Issues = "https://github.com/ellmos-ai/ai-media-editor/issues"
Documentation = "https://github.com/ellmos-ai/ai-media-editor#readme"

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
addopts = "-v"
