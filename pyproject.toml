[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-media-editor"
version = "0.2.3"
description = "Local-first AI media editor for video, audio, and podcast workflows driven by AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES.txt"]
keywords = [
    "faster-whisper",
    "hyperframes",
    "local-transcription",
    "media-editing",
    "podcast-editing",
    "video-editing",
    "whisperx",
    "ai-media-editor",
    "agent-workflow",
    "ai-video-editing",
    "local-first",
    "podcast-tools",
    "transcript-editing",
    "audio-editing",
    "ellmos-ai",
    "offline-first",
    "open-bricks",
    "python",
    "runasinvoker",
    "zero-egress"
]
authors = [
    { name = "ellmos-ai" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]

[project.scripts]
ai-media-editor = "ai_media_editor.editor:main"

[project.optional-dependencies]
storyboard = [
    "clip-storyboard-director @ git+https://github.com/ellmos-ai/clip-storyboard-director.git@efd7159cacd34b3067b80543268cd70f68731b1b",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/ai-media-editor#readme"
Repository = "https://github.com/ellmos-ai/ai-media-editor.git"
Issues = "https://github.com/ellmos-ai/ai-media-editor/issues"
Documentation = "https://github.com/ellmos-ai/ai-media-editor#readme"
Changelog = "https://github.com/ellmos-ai/ai-media-editor/blob/main/CHANGELOG.md"
Contributing = "https://github.com/ellmos-ai/ai-media-editor/blob/main/CONTRIBUTING.md"
Security = "https://github.com/ellmos-ai/ai-media-editor/blob/main/SECURITY.md"
"Third-Party Licenses" = "https://github.com/ellmos-ai/ai-media-editor/blob/main/THIRD_PARTY_LICENSES.md"
"Third-Party Licenses (Text)" = "https://github.com/ellmos-ai/ai-media-editor/blob/main/THIRD_PARTY_LICENSES.txt"
"Plain-Text Licenses" = "https://github.com/ellmos-ai/ai-media-editor/blob/main/THIRD_PARTY_LICENSES.txt"
"Level 1 SBOM" = "https://github.com/ellmos-ai/ai-media-editor/blob/main/THIRD_PARTY_LICENSES.md"
"Marketing Log" = "https://github.com/ellmos-ai/ai-media-editor/blob/main/MARKETING-LOG.txt"
"LLM Ready" = "https://github.com/ellmos-ai/ai-media-editor/blob/main/llms.txt"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"
Notice = "https://github.com/ellmos-ai/ai-media-editor/blob/main/NOTICE"

[tool.setuptools.packages.find]
include = ["ai_media_editor*"]

[tool.setuptools.package-data]
"ai_media_editor.tools" = ["*.cjs", "*.cmd", "*.ps1", "*.vbs"]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = "."
testpaths = ["tests"]
norecursedirs = [".venv", "venv", "build", "dist", ".git", ".pytest_cache", ".pytest_temp", ".pytest_tmp*", ".ruff_cache", ".hypothesis", ".turbo", ".nyc_output", ".tox"]
addopts = "-ra -v --basetemp=.pytest_temp"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "RUF022"]
ignore = ["E501"]
