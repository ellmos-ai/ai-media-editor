[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-media-editor"
version = "0.2.0"
description = "Local-first AI media editor for video, audio, and podcast workflows driven by AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "ai",
    "video-editor",
    "podcast-editor",
    "local-stt",
    "faster-whisper",
    "whisperx",
    "hyperframes",
    "video-use",
    "agent-workflow",
    "llm-ready"
]
authors = [
    { name = "ellmos-ai" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/ai-media-editor"
Repository = "https://github.com/ellmos-ai/ai-media-editor.git"
Issues = "https://github.com/ellmos-ai/ai-media-editor/issues"
Documentation = "https://github.com/ellmos-ai/ai-media-editor#readme"
Changelog = "https://github.com/ellmos-ai/ai-media-editor/blob/main/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/ai-media-editor/blob/main/SECURITY.md"
"Third-Party Licenses" = "https://github.com/ellmos-ai/ai-media-editor/blob/main/THIRD_PARTY_LICENSES.md"
"Marketing Log" = "https://github.com/ellmos-ai/ai-media-editor/blob/main/MARKETING-LOG.txt"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
addopts = "-ra -v"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
